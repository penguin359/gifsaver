name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libgif-dev libasound2-dev

      - name: Build (default, with audio)
        run: make

      - name: Smoke test (no X display or GIF file needed)
        run: |
          ./gifsaver -version
          ./gifsaver -help

      - name: Build (without audio)
        run: |
          make clean
          make AUDIO=0
          ./gifsaver -version
          if ldd gifsaver | grep -q asound; then
            echo "error: no-audio build still links libasound" >&2
            exit 1
          fi
